<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DIGGR — Creusez l'or de vos concurrents</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%22 stop-color=%22%23FFD04D%22/><stop offset=%22100%22 stop-color=%22%23D18D2A%22/></linearGradient></defs><path d=%22M50 14 L82 34 L82 66 L50 86 L18 66 L18 34 Z%22 fill=%22url(%23g)%22/><path d=%22M50 40 L64 49 L64 58 L50 67 L36 58 L36 49 Z%22 fill=%22%230A0A0B%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --bg-elev:#111114; --bg-2:#141418;
    --glass:rgba(255,255,255,0.02); --glass-hi:rgba(255,255,255,0.035); --glass-hover:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.07); --border-hi:rgba(255,255,255,0.13); --border-active:rgba(255,255,255,0.24);
    --text:#ECECEF; --dim:#9A9AA3; --mute:#63636C; --faint:#3C3C44;
    /* OR DIGGR — la pépite. Dégradé clair→or→bronze, reflet métallique. */
    --accent:#E9AE3A; --accent-soft:rgba(233,174,58,.13); --accent-glow:rgba(255,208,77,.42);
    --gold-1:#FFD04D; --gold-2:#D18D2A;
    --gold-grad:linear-gradient(135deg,#FFD04D 0%,#EBB43E 46%,#D18D2A 100%);
    --gold-sheen:linear-gradient(105deg,transparent 20%,rgba(255,240,190,.55) 48%,transparent 76%);
    /* Les deux AXES — signature produit */
    --capt:#fb7185; --capt-soft:rgba(251,113,133,.14);       /* CAPTATION (client d'un concurrent) */
    --inter:#38bdf8; --inter-soft:rgba(56,189,248,.14);      /* INTERCEPTION (prospect d'un concurrent) */
    --cold:#a78bfa; --cold-soft:rgba(167,139,250,.15);   /* AXE 3 = ACQUISITION (captation ICP froide, moteur V2) */
    /* TIER (qualité, arbre FIT) */
    --ta:#34d399; --ta-soft:rgba(52,211,153,.14); --tb:#fbbf24; --tb-soft:rgba(251,191,36,.13); --tc:#6b7280; --tc-soft:rgba(107,114,128,.13);
    /* FENÊTRE (timing) */
    --w-open:#E9AE3A; --w-warm:#eab308; --w-cold:#3a3a42;
    --cert-hi:#4ade80; --cert-mid:#fbbf24; --cert-lo:#6b7280;
    --gold:#E9AE3A; --gold-glow:rgba(255,208,77,.30);
    --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
    --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.4,.5,1); --smooth:cubic-bezier(.4,0,.2,1);
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
    font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
  #root{height:100%}
  /* mesh animé + grain (identité EuroGuide) */
  .mesh{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.9;
    background:
      radial-gradient(ellipse 46% 40% at 18% 16%, rgba(255,208,77,.11), transparent 60%),
      radial-gradient(ellipse 40% 48% at 82% 26%, rgba(56,189,248,.08), transparent 60%),
      radial-gradient(ellipse 52% 42% at 62% 88%, rgba(251,113,133,.07), transparent 60%),
      radial-gradient(ellipse 40% 40% at 30% 80%, rgba(236,201,75,.045), transparent 60%);
    animation:drift 26s var(--smooth) infinite alternate}
  @keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(2.5%,-2%) rotate(1.5deg)}100%{transform:translate(-2%,2.5%) rotate(-1deg)}}
  .grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.010) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.010) 1px,transparent 1px);
    background-size:52px 52px;mask:radial-gradient(ellipse 90% 80% at 50% 40%,#000,transparent)}
  @media (prefers-reduced-motion:reduce){.mesh{animation:none}}

  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
  /* ---------- TOPBAR ---------- */
  .topbar{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 22px;
    background:rgba(10,10,11,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);position:relative;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:15px}
  .brand .glyph{width:24px;height:24px;background:var(--gold-grad);position:relative;box-shadow:0 0 16px var(--accent-glow);clip-path:polygon(50% 3%,90% 27%,90% 73%,50% 97%,10% 73%,10% 27%)}
  .brand .glyph::after{content:'';position:absolute;inset:7px;background:var(--bg);clip-path:polygon(50% 6%,86% 30%,86% 70%,50% 94%,14% 70%,14% 30%)}
  .brand .word{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-style:italic;letter-spacing:.01em;font-size:22px;line-height:1.25;padding:2px 6px 2px 1px;overflow:visible;white-space:nowrap;filter:drop-shadow(0 1px 6px rgba(255,208,77,.22))}
  .brand{overflow:visible}
  .brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--mute);font-weight:500;text-transform:uppercase}
  .spacer{flex:1}
  .tprim{display:flex;gap:2px;align-items:center;height:100%}
  .nav-item{position:relative;height:100%;display:flex;align-items:center;gap:8px;padding:0 15px;border:none;background:none;
    color:var(--dim);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:color .16s var(--smooth)}
  .nav-item:hover{color:var(--text)}
  .nav-item.on{color:var(--text);font-weight:600}
  .nav-item.on::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--gold-grad);box-shadow:0 0 12px var(--accent-glow)}
  .nav-item .badge-dot{width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .ico-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--glass);color:var(--dim);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s var(--smooth)}
  .ico-btn:hover{background:var(--glass-hover);color:var(--text);border-color:var(--border-hi)}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .meta .mn{color:var(--text);font-weight:600}
  .meta .msep{width:1px;height:13px;background:var(--border);margin:0 5px}
  .meta .mdot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold-glow);animation:pulse 1.2s var(--smooth) infinite}
  .sep{width:1px;height:22px;background:var(--border)}

  /* ---------- axis lens (segmented) ---------- */
  .lens{display:inline-flex;padding:3px;gap:3px;background:var(--glass);border:1px solid var(--border);border-radius:999px}
  .lens button{border:none;background:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:12.5px;
    color:var(--dim);padding:6px 15px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;transition:.18s var(--spring)}
  .lens button .d{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
  .lens button:hover{color:var(--text)}
  .lens button.on{color:var(--text)}
  .lens button.on.capt{background:var(--capt-soft);color:var(--capt)} .lens button.on.capt .d{opacity:1;box-shadow:0 0 8px var(--capt)}
  .lens button.on.inter{background:var(--inter-soft);color:var(--inter)} .lens button.on.inter .d{opacity:1;box-shadow:0 0 8px var(--inter)}
  .lens button.on.acq{background:var(--cold-soft);color:var(--cold)} .lens button.on.acq .d{opacity:1;box-shadow:0 0 8px var(--cold)}
  .lens button.on.all{background:var(--glass-hover);color:var(--text)}

  /* ---------- content shell ---------- */
  .content{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--border-hi) transparent}
  .content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:6px;border:3px solid var(--bg)}
  .wrap{max-width:1560px;margin:0 auto;padding:22px 26px 60px}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
  .pagehead h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
  .pagehead .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}

  /* ---------- glass card ---------- */
  .card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-lg);backdrop-filter:blur(8px)}
  .card.pad{padding:18px}
  .card.hover{transition:transform .2s var(--ease),border-color .2s,background .2s}
  .card.hover:hover{transform:translateY(-2px);border-color:var(--border-hi);background:var(--glass-hi)}

  /* ---------- stat tiles ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .stat{padding:15px 17px;position:relative;overflow:hidden}
  .stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .stat .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat .foot{font-size:11.5px;color:var(--dim);margin-top:2px}
  .stat .rail{position:absolute;left:0;top:0;bottom:0;width:3px}

  /* ---------- badges & pills ---------- */
  .tier{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:11px;padding:3px 8px;border-radius:7px}
  .tier .r{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
  .tier.A{background:var(--ta-soft);color:var(--ta)} .tier.A .r{background:var(--ta);color:#04170e}
  .tier.B{background:var(--tb-soft);color:var(--tb)} .tier.B .r{background:var(--tb);color:#1a1204}
  .tier.C{background:var(--tc-soft);color:var(--tc)} .tier.C .r{background:var(--tc);color:#0a0a0a}
  .axisbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  .axisbadge.client{background:var(--capt-soft);color:var(--capt)}
  .axisbadge.prospect{background:var(--inter-soft);color:var(--inter)}
  .axisbadge.cold{background:var(--cold-soft);color:var(--cold)}
  .axisbadge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .wpill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--border)}
  .wpill .d{width:7px;height:7px;border-radius:50%}
  .wpill.OPEN{color:var(--w-open);border-color:rgba(233,174,58,.34)} .wpill.OPEN .d{background:var(--w-open);box-shadow:0 0 9px var(--accent-glow);animation:pulse 1.1s var(--smooth) infinite}
  .wpill.WARM{color:var(--w-warm)} .wpill.WARM .d{background:var(--w-warm)}
  .wpill.CLOSED{color:var(--mute)} .wpill.CLOSED .d{background:var(--w-cold)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  @media (prefers-reduced-motion:reduce){.wpill.OPEN .d{animation:none}}
  .scorebar{display:flex;align-items:center;gap:9px;min-width:120px}
  .scorebar .track{flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden;position:relative}
  .scorebar .fill{height:100%;border-radius:3px;transition:width .5s var(--ease)}
  .scorebar .band-IN{background:linear-gradient(90deg,var(--ta),#6ee7b7)}
  .scorebar .band-BAND{background:linear-gradient(90deg,var(--tb),#fcd34d)}
  .scorebar .band-OUT{background:var(--tc)}
  .scorebar .val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;width:34px;text-align:right}
  .certdot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .certdot.haute{background:var(--cert-hi)} .certdot.moyenne{background:var(--cert-mid)} .certdot.basse{background:var(--cert-lo)}
  .prov{font-family:var(--mono);font-size:10.5px;font-weight:500}
  .prov a{color:var(--capt);text-decoration:none;border-bottom:1px dotted rgba(251,113,133,.4)} .prov a:hover{border-bottom-style:solid}
  .quote{border-left:2px solid var(--accent);padding:3px 0 3px 11px;color:var(--dim);font-style:italic;font-size:12.5px;line-height:1.5}
  .quote .src{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:4px;letter-spacing:.03em}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;
    border-radius:10px;padding:9px 16px;border:1px solid transparent;transition:.15s var(--smooth);white-space:nowrap}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.pri{background:var(--gold-grad);color:#1c1305;box-shadow:0 4px 20px -7px var(--accent-glow);position:relative;overflow:hidden}
  .btn.pri::after{content:'';position:absolute;inset:0;background:var(--gold-sheen);transform:translateX(-120%);transition:none}
  .btn.pri:hover:not(:disabled)::after{animation:sheen .9s var(--smooth)}
  @keyframes sheen{to{transform:translateX(120%)}}
  .btn.pri:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
  .btn.ghost{background:var(--glass);border-color:var(--border);color:var(--text)}
  .btn.ghost:hover:not(:disabled){background:var(--glass-hover);border-color:var(--border-hi)}
  .btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
  .btn .spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- table ---------- */
  .tablecard{overflow:hidden}
  .ttoolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
  .search{flex:1;min-width:200px;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:0 11px;height:34px}
  .search input{flex:1;background:none;border:none;color:var(--text);font-family:inherit;font-size:12.5px;outline:none}
  .search input::placeholder{color:var(--mute)}
  .tscroll{overflow:auto;max-height:calc(100vh - 320px)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
  thead th{position:sticky;top:0;z-index:2;background:rgba(17,17,20,.94);backdrop-filter:blur(8px);text-align:left;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500;
    padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
  thead th:hover{color:var(--dim)}
  thead th .ar{margin-left:5px;color:var(--accent)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--glass-hi)}
  tbody tr:last-child td{border-bottom:none}
  .cname{font-weight:600;color:var(--text)}
  .cdom{font-family:var(--mono);font-size:11px;color:var(--mute)}
  .flagcount{font-family:var(--mono);font-size:11px;color:var(--dim);display:inline-flex;align-items:center;gap:5px}

  /* ---------- radar (rival boards) ---------- */
  .radargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
  .acqwrap{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
  @media(max-width:820px){.acqwrap{grid-template-columns:1fr}}
  .rboard{overflow:hidden}
  .rboard .rhead{display:flex;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--border)}
  .rlogo{width:34px;height:34px;border-radius:9px;background:var(--glass-hi);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--dim);font-size:15px;flex:none}
  .rboard .rname{font-weight:700;font-size:15px}
  .rboard .rnote{font-size:11.5px;color:var(--mute)}
  .faille{margin:12px 17px;padding:11px 13px;background:rgba(251,113,133,.06);border:1px solid rgba(251,113,133,.16);border-radius:11px}
  .faille .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--capt);display:flex;align-items:center;gap:6px}
  .faille .nm{font-weight:600;font-size:13px;margin:5px 0 3px}
  .faille .lv{font-size:12px;color:var(--dim)}
  .rsplit{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin:0 0 0 0}
  .rcol{background:var(--bg-elev);padding:12px 15px}
  .rcol .ch{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .rcol.capt .ch{color:var(--capt)} .rcol.inter .ch{color:var(--inter)}
  .miniacct{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-radius:7px;transition:.12s}
  .miniacct:hover{background:var(--glass-hi);padding-left:6px;margin-left:-6px}
  .miniacct .mn{flex:1;min-width:0;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .miniacct .mw{flex:none}

  /* signal feed */
  .feed{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--r-md);overflow:hidden}
  .fitem{display:flex;align-items:center;gap:13px;padding:12px 15px;background:var(--bg-elev);cursor:pointer;transition:.12s}
  .fitem:hover{background:var(--glass-hi)}
  .ficon{width:32px;height:32px;border-radius:9px;background:var(--glass-hi);display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
  .fmain{flex:1;min-width:0}
  .ftitle{font-weight:600;font-size:13px}
  .fmeta{font-size:11.5px;color:var(--mute);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .strengthbadge{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
  .strengthbadge.hi{background:var(--accent-soft);color:var(--accent)} .strengthbadge.md{background:var(--tb-soft);color:var(--tb)} .strengthbadge.lo{background:var(--glass-hi);color:var(--dim)}

  /* ---------- brief (screen 4) ---------- */
  .brief{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
  .briefmain{display:flex;flex-direction:column;gap:14px;min-width:0}
  .bhero{padding:20px;position:relative;overflow:hidden}
  .bherotop{display:flex;gap:16px;align-items:flex-start}
  .crest{position:relative;width:56px;height:56px;flex:none;border-radius:14px;background:var(--glass-hi);border:1px solid var(--border-hi);display:flex;align-items:center;justify-content:center;overflow:visible;box-shadow:0 0 0 4px rgba(255,208,77,.05)}
  .crest img{width:100%;height:100%;border-radius:13px;object-fit:cover}
  .crest .cfb{font-family:var(--serif,var(--sans));font-weight:800;font-size:24px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .spk{display:inline-block;filter:drop-shadow(0 0 4px var(--gold-glow));animation:twinkle 2.4s var(--smooth) infinite}
  .spk.s2{animation-delay:.8s}.spk.s3{animation-delay:1.5s}
  @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.82) rotate(0)}50%{opacity:1;transform:scale(1) rotate(15deg)}}
  .crest .spk{position:absolute}
  .crest .spk.a{top:-7px;right:-7px}.crest .spk.b{bottom:-5px;left:-6px}
  @media (prefers-reduced-motion:reduce){.spk{animation:none;opacity:.9}}
  .bhero .headline{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:-.01em;margin:10px 0 14px;max-width:60ch}
  .bhero .metaline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .block{padding:16px 17px}
  .block h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .block h3 .n{color:var(--accent)}
  .kv{display:flex;flex-direction:column;gap:10px}
  .krow{display:flex;gap:10px}
  .krow .kbullet{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
  .krow .kl{font-weight:600;font-size:13px} .krow .kd{font-size:12px;color:var(--dim);margin-top:1px}
  .member{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
  .member:last-child{border:none}
  .mrole{font-weight:600;font-size:13px} .mwhy{font-size:12px;color:var(--dim);margin-top:2px}
  .menrich{font-family:var(--mono);font-size:10.5px;color:var(--inter);margin-top:5px;display:inline-flex;align-items:center;gap:5px}
  .msg{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:15px 16px;font-size:13px;line-height:1.62;white-space:pre-wrap;color:var(--text)}
  .msgbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .lever{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
  .lever:last-child{border:none}
  .lever .li{width:24px;height:24px;border-radius:7px;background:var(--gold-glow);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
  .lever .ll{font-weight:600;font-size:13px} .lever .lp{font-size:11.5px;color:var(--mute);margin-top:2px}

  /* chatbot rail */
  .chatrail{position:sticky;top:16px;height:calc(100vh - 92px);max-height:760px;display:flex;flex-direction:column;overflow:hidden}
  .chathead{padding:15px 17px;border-bottom:1px solid var(--border)}
  .chathead .t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}
  .chathead .s{font-size:11.5px;color:var(--mute);margin-top:2px}
  .chatlog{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .bubble{max-width:92%;padding:10px 13px;border-radius:13px;font-size:12.8px;line-height:1.5}
  .bubble.u{align-self:flex-end;background:var(--accent-soft);color:var(--text);border:1px solid rgba(233,174,58,.22)}
  .bubble.a{align-self:flex-start;background:var(--glass-hi);border:1px solid var(--border);color:var(--text)}
  .bubble.a.abstain{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06)}
  .chatempty{color:var(--mute);font-size:12.5px;text-align:center;padding:20px 10px}
  .suggests{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
  .sugg{font-size:11.5px;color:var(--dim);background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:6px 11px;cursor:pointer;transition:.12s}
  .sugg:hover{background:var(--glass-hover);color:var(--text);border-color:var(--border-hi)}
  .chatin{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
  .chatin input{flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:0 13px;height:38px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none}
  .chatin input:focus{border-color:var(--border-active)}
  .typing{display:inline-flex;gap:4px}.typing span{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ---------- onboarding wizard ---------- */
  .wizwrap{max-width:760px;margin:0 auto;padding:30px 26px 60px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:30px}
  .snode{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
  .snode .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--border-hi);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--mute);background:var(--bg-elev);transition:.25s var(--spring);z-index:2}
  .snode.done .dot{background:var(--ta);border-color:var(--ta);color:#04170e}
  .snode.active .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
  .snode .lbl{font-size:11.5px;color:var(--mute);font-weight:500}
  .snode.active .lbl,.snode.done .lbl{color:var(--text)}
  .sline{width:90px;height:2px;background:var(--border-hi);margin:0 4px;margin-bottom:26px;position:relative;overflow:hidden}
  .sline .fill{position:absolute;inset:0;width:0;background:var(--accent);transition:width .4s var(--ease)}
  .sline.done .fill{width:100%}
  .steptitle{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .stepsub{color:var(--dim);font-size:13px;margin:5px 0 22px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
  .field .hint{font-size:11.5px;color:var(--mute);margin-top:6px}
  .inp,.ta{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:11px;color:var(--text);font-family:inherit;font-size:13px;padding:11px 13px;outline:none;transition:border-color .15s}
  .inp:focus,.ta:focus{border-color:var(--border-active)}
  .ta{resize:vertical;min-height:96px;line-height:1.55}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip-e{display:inline-flex;align-items:center;gap:7px;background:var(--glass-hi);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12.5px}
  .chip-e button{background:none;border:none;color:var(--mute);cursor:pointer;font-size:14px;line-height:1}.chip-e button:hover{color:var(--bad)}
  .keyrow{display:flex;align-items:center;gap:13px;padding:14px;background:var(--glass);border:1px solid var(--border);border-radius:13px;margin-bottom:12px}
  .keyrow .kdot{width:9px;height:9px;border-radius:50%;flex:none}
  .keyrow .kdot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.keyrow .kdot.no{background:var(--mute)}
  .keyrow .kinfo{flex:1;min-width:0}
  .keyrow .kl{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .keyrow .kr{font-size:11.5px;color:var(--dim);margin-top:2px}
  .keyrow .khow{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:3px}
  .keyrow input{width:230px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 11px;outline:none}
  .req{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase}
  .rivalcard{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--glass);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;transition:.15s}
  .rivalcard.off{opacity:.4}
  .rivalcard .rname{font-weight:600;font-size:13.5px}
  .rivalcard .rwhy{font-size:11.5px;color:var(--dim);margin-top:2px}
  .toggle{width:38px;height:22px;border-radius:999px;background:var(--mute);position:relative;cursor:pointer;flex:none;transition:.2s}
  .toggle.on{background:var(--accent)}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s var(--spring)}
  .toggle.on::after{transform:translateX(16px)}
  .wizbar{display:flex;align-items:center;justify-content:space-between;margin-top:26px;padding-top:20px;border-top:1px solid var(--border)}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s}
  @keyframes fade{from{opacity:0}}
  .modal{width:100%;max-width:520px;background:var(--bg-elev);border:1px solid var(--border-hi);border-radius:var(--r-xl);overflow:hidden;box-shadow:0 30px 80px -20px #000}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--border)}
  .modal .mh h2{font-size:16px;font-weight:700}
  .modal .mb{padding:20px;max-height:70vh;overflow:auto}

  .empty{text-align:center;padding:70px 20px;color:var(--mute)}
  .empty .big{font-size:16px;color:var(--dim);font-weight:600;margin-bottom:6px}
  .reveal{animation:rise .4s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  @media (prefers-reduced-motion:reduce){.reveal{animation:none}}
  a.link{color:var(--accent);text-decoration:none}
  .muted{color:var(--mute)} .dim{color:var(--dim)}
  @media(max-width:1080px){.brief{grid-template-columns:1fr}.chatrail{position:relative;height:520px}.bgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mesh"></div><div class="grain"></div>
<div id="root"></div>
<script type="module">
import React,{useState,useEffect,useRef,useMemo,useCallback} from "https://esm.sh/react@18.3.1";
import {createRoot} from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";
const html=htm.bind(React.createElement);
const $=React.createElement;

async function api(path,opts){const r=await fetch(path,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.statusText);return d;}

/* ---------- icons (outline, stroke 1.6) ---------- */
const IC={
  install:"M4 6h16M4 12h16M4 18h10", table:"M3 5h18v14H3zM3 10h18M9 5v14",
  radar:"M12 2a10 10 0 1 0 10 10M12 12l6-3M12 12v-7", brief:"M6 3h9l5 5v13H6zM15 3v5h5M9 13h6M9 17h6",
  hire:"M16 21v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8", move:"M5 12h14M13 6l6 6-6 6",
  post:"M4 4h16v12H8l-4 4z", corp:"M4 21V7l8-4 8 4v14M9 21v-5h6v5", link:"M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1",
  event:"M3 8h18M7 3v4m10-4v4M5 6h14v14H5z", need:"M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c1 .8 1.5 1.5 1.5 2.3h5c0-.8.5-1.5 1.5-2.3A7 7 0 0 0 12 2z",
  budget:"M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
  bolt:"M13 2 3 14h7l-1 8 10-12h-7z", target:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 4a1 1 0 1 0 0 2 1 1 0 0 0 0-2z",
  send:"M22 2 11 13M22 2l-7 20-4-9-9-4z", copy:"M9 9h11v11H9zM5 15H4V4h11v1", gear:"M4 6h10M18 6h2M4 12h2M10 12h10M4 18h7M15 18h5M14 4v4M6 10v4M11 16v4",
  refresh:"M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5", spark:"M12 3l1.9 5.6L19 10l-5.1 1.4L12 17l-1.9-5.6L5 10l5.1-1.4z",
  check:"M20 6 9 17l-5-5", user:"M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8", chat:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z", flag:"M4 22V4h13l-2 4 2 4H4"
};
function Icon({n,s=16,w=1.6}){return html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=${w} stroke-linecap="round" stroke-linejoin="round"><path d=${IC[n]||IC.post}/></svg>`;}
function Sparkle({s=13,cls=""}){return html`<svg class=${"spk "+cls} width=${s} height=${s} viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 6.6 12 0 12 6.6 12 12 17.4 12 24 12 17.4 17.4 12 24 12 17.4 12 12 6.6 12 0Z" fill="#F4C64E"/></svg>`;}

/* ---------- shared components ---------- */
const AXES={client:{label:"Captation",cls:"client",icon:"hire",verb:"Voler à"},prospect:{label:"Interception",cls:"prospect",icon:"target",verb:"Devancer chez"},cold:{label:"Acquisition",cls:"cold",icon:"user",verb:""}};
function AxisBadge({axis}){const a=AXES[axis]||AXES.cold;return html`<span class="axisbadge ${a.cls}"><span class="d"></span>${a.label}</span>`;}
function Tier({t}){if(!t)return html`<span class="muted">—</span>`;return html`<span class="tier ${t}"><span class="r">${t}</span></span>`;}
function ScoreBar({fit}){const w=Math.max(2,Math.min(100,fit.expected));return html`<div class="scorebar"><div class="track"><div class="fill band-${fit.band}" style=${{width:w+"%"}}></div></div><span class="val">${Math.round(fit.expected)}</span></div>`;}
function WindowPill({w}){const L={OPEN:"Ouverte",WARM:"Tiède",CLOSED:"Fermée"};return html`<span class="wpill ${w}"><span class="d"></span>${L[w]}</span>`;}
function CertDot({c}){if(!c)return null;return html`<span class="certdot ${c}" title=${"Certitude "+c+" — fondé sur citation"}></span>`;}
function Strength({s}){const c=s>=8?"hi":s>=6?"md":"lo";return html`<span class="strengthbadge ${c}">${s}/10</span>`;}
function rel(d){return d===0?"aujourd'hui":d===1?"hier":"il y a "+d+"j";}

/* count-up */
function useCount(target,ms=900){const[v,setV]=useState(0);useEffect(()=>{let raf,t0;const step=t=>{if(!t0)t0=t;const p=Math.min(1,(t-t0)/ms);setV(target*(1-Math.pow(1-p,3)));if(p<1)raf=requestAnimationFrame(step);};raf=requestAnimationFrame(step);return()=>cancelAnimationFrame(raf);},[target]);return v;}
function Stat({k,v,foot,color,suffix}){const n=useCount(typeof v==="number"?v:0);return html`<div class="card stat reveal"><div class="rail" style=${{background:color||"var(--accent)"}}></div><div class="k">${k}</div><div class="v">${typeof v==="number"?Math.round(n):v}${suffix||""}</div>${foot&&html`<div class="foot">${foot}</div>`}</div>`;}

/* ======================================================= APP ======================================================= */
function App(){
  const[seed,setSeed]=useState(null);
  const[route,setRoute]=useState(location.hash||"#/radar");
  const[axis,setAxis]=useState("all"); // all|client|prospect
  const[settings,setSettings]=useState(null);
  const[showSettings,setShowSettings]=useState(false);

  useEffect(()=>{api("/api/seed").then(setSeed).catch(e=>setSeed({error:e.message}));
    api("/api/settings").then(setSettings).catch(()=>{});
    const h=()=>setRoute(location.hash||"#/radar");window.addEventListener("hashchange",h);return()=>window.removeEventListener("hashchange",h);},[]);
  const go=useCallback(r=>{location.hash=r;},[]);
  const configDone=settings&&settings.keys&&settings.keys.filter(k=>k.required).every(k=>k.present);

  if(!seed)return html`<div class="app"><div style=${{margin:"auto",color:"var(--dim)"}}>Chargement…</div></div>`;
  const view=route.split("/")[1]||"radar";
  const briefId=view==="brief"?route.split("/")[2]:null;

  return html`<div class="app">
    <div class="topbar">
      <div class="brand"><span class="word">DIGGR</span></div>
      <div class="sep"></div>
      <nav class="tprim">
        ${[["install","Installation","install"],["comptes","Comptes","table"],["radar","Radar","radar"]].map(([v,l,ic])=>html`
          <button key=${v} class=${"nav-item"+(view===v?" on":"")} onClick=${()=>go("#/"+v)}>
            <${Icon} n=${ic} s=15/>${l}${v==="install"&&!configDone&&html`<span class="badge-dot"></span>`}
          </button>`)}
        ${briefId&&html`<button class="nav-item on"><${Icon} n="brief" s=15/>Brief</button>`}
      </nav>
      <div class="spacer"></div>
      ${(view==="comptes"||view==="radar")&&html`<${AxisLens} axis=${axis} setAxis=${setAxis}/>`}
      <div class="meta"><span class="mn">${seed.accounts.length}</span> comptes<span class="msep"></span><span class="mdot"></span><span class="mn" style=${{color:"var(--gold)"}}>${seed.accounts.filter(a=>a.window.state==="OPEN").length}</span> <span style=${{color:"var(--gold)"}}>ouvertes</span></div>
      <button class="ico-btn" title="Réglages" onClick=${()=>setShowSettings(true)}><${Icon} n="gear"/></button>
    </div>
    <div class="content">
      ${view==="install"&&html`<${Onboarding} seed=${seed} settings=${settings} setSettings=${setSettings} go=${go}/>`}
      ${view==="comptes"&&html`<${Comptes} seed=${seed} axis=${axis} go=${go}/>`}
      ${view==="radar"&&html`<${Radar} seed=${seed} axis=${axis} go=${go}/>`}
      ${view==="brief"&&html`<${Brief} seed=${seed} id=${briefId} go=${go}/>`}
    </div>
    ${showSettings&&html`<${Settings} settings=${settings} setSettings=${setSettings} onClose=${()=>setShowSettings(false)}/>`}
  </div>`;
}

function AxisLens({axis,setAxis}){
  return html`<div class="lens">
    <button class=${"all"+(axis==="all"?" on all":"")} onClick=${()=>setAxis("all")}><span class="d"></span>Tout</button>
    <button class=${"capt"+(axis==="client"?" on capt":"")} onClick=${()=>setAxis("client")}><span class="d"></span>Captation</button>
    <button class=${"inter"+(axis==="prospect"?" on inter":"")} onClick=${()=>setAxis("prospect")}><span class="d"></span>Interception</button>
    <button class=${"acq"+(axis==="cold"?" on acq":"")} onClick=${()=>setAxis("cold")}><span class="d"></span>Acquisition</button>
  </div>`;
}

/* ======================================================= RADAR ======================================================= */
function Radar({seed,axis,go}){
  const filt=a=>axis==="all"||a.axis===axis;
  const accounts=seed.accounts.filter(filt);
  const cold=accounts.filter(a=>a.axis==="cold");
  const openHot=accounts.filter(a=>a.window.state==="OPEN").sort((a,b)=>b.window.strongest-a.window.strongest||b.fit.expected-a.fit.expected);
  const st=seed.stats;
  return html`<div class="wrap">
    <div class="pagehead"><div>
      <div class="eyebrow">Radar de déplacement</div>
      <h1>Où sont les fenêtres ouvertes</h1>
      <div class="sub">Les clients et prospects de vos concurrents, et le moment d'agir. ${st.rivals} concurrents surveillés · ${st.signals} signaux captés.</div>
    </div></div>
    <div class="stats">
      <${Stat} k="Captation" v=${st.clients} color="var(--capt)" foot="clients de concurrents"/>
      <${Stat} k="Interception" v=${st.prospects} color="var(--inter)" foot="prospects qui les évaluent"/>
      <${Stat} k="Acquisition" v=${st.acquisition||st.cold||0} color="var(--cold)" foot="prospects ICP · moteur V2"/>
      <${Stat} k="Fenêtres ouvertes" v=${st.open_windows} color="var(--w-open)" foot="à démarcher maintenant"/>
      <${Stat} k="Volume estimé" v=${seed.viability.qualified_week} suffix="/sem" color="var(--gold)" foot=${"à "+seed.viability.universe+" comptes surveillés"}/>
    </div>

    <div class="card pad reveal" style=${{marginBottom:"20px"}}>
      <div style=${{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}>
        <${Icon} n="bolt" s=16/><b style=${{fontSize:"15px"}}>À démarcher maintenant</b>
        <span class="wpill OPEN" style=${{marginLeft:"auto"}}><span class="d"></span>${openHot.length} fenêtres ouvertes</span>
      </div>
      <div class="feed">
        ${openHot.slice(0,7).map((a,i)=>{const f=a.window.flags[0]||{};return html`
          <div key=${a.id} class="fitem reveal" style=${{animationDelay:(i*35)+"ms"}} onClick=${()=>go("#/brief/"+a.id)}>
            <div class="ficon"><${Icon} n=${f.icon||"flag"}/></div>
            <div class="fmain">
              <div class="ftitle">${a.name} <span class="dim" style=${{fontWeight:400}}>— ${f.name||"signal"}</span></div>
              <div class="fmeta"><${AxisBadge} axis=${a.axis}/>${a.rival&&html`<span class="prov">${AXES[a.axis].verb} <a onClick=${e=>e.stopPropagation()}>${a.rival}</a></span>`}<span>·</span><span>${rel(f.days_ago||0)}</span></div>
            </div>
            <${Strength} s=${f.strength||a.window.strongest}/>
            <${Tier} t=${a.fit.tier}/>
            <button class="btn ghost sm" onClick=${e=>{e.stopPropagation();go("#/brief/"+a.id);}}>Ouvrir<${Icon} n="move" s=13/></button>
          </div>`;})}
        ${!openHot.length&&html`<div class="fitem"><span class="muted">Aucune fenêtre ouverte sur cet axe pour l'instant.</span></div>`}
      </div>
    </div>

    ${accounts.some(a=>a.rival)&&html`<div class="pagehead"><div><div class="eyebrow">Par concurrent</div><h1 style=${{fontSize:"18px"}}>Le champ de bataille</h1></div></div>
    <div class="radargrid">
      ${seed.rivals.map((r,i)=>html`<${RivalBoard} key=${r.id} rival=${r} accounts=${accounts.filter(a=>a.rival===r.name)} go=${go} delay=${i*40}/>`)}
    </div>`}

    ${cold.length>0&&html`<div>
      <div class="pagehead" style=${{marginTop:"28px"}}><div>
        <div class="eyebrow" style=${{color:"var(--cold)"}}>Axe Acquisition · moteur V2</div>
        <h1 style=${{fontSize:"18px"}}>Prospects ICP — la captation V2</h1>
        <div class="sub">Sourcing froid par profil idéal, scoré par le moteur signal-natif de la V2. Pas de concurrent : on ouvre sur la valeur.</div>
      </div></div>
      <div class="acqwrap">
        ${seed.acq_verdict&&html`<div class="card pad reveal">
          <div style=${{fontFamily:"var(--mono)",fontSize:"10px",letterSpacing:".1em",textTransform:"uppercase",color:"var(--dim)",marginBottom:"11px"}}>Viabilité du motion · verdict.py</div>
          <div style=${{fontSize:"22px",fontWeight:800,color:"var(--cold)",letterSpacing:"-.02em"}}>${seed.acq_verdict.verdict}</div>
          <div class="sub" style=${{fontSize:"12px",lineHeight:1.5,marginTop:"8px"}}>${seed.acq_verdict.explication}</div>
          <div style=${{display:"flex",gap:"22px",marginTop:"14px"}}>
            <div><div style=${{fontSize:"19px",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>${seed.acq_verdict.meeting_rate}%</div><div class="muted" style=${{fontSize:"10.5px"}}>taux RDV</div></div>
            <div><div style=${{fontSize:"19px",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>${seed.acq_verdict.positive_rate}%</div><div class="muted" style=${{fontSize:"10.5px"}}>réponses +</div></div>
          </div></div>`}
        <div class="card feed reveal">
          ${cold.map(a=>html`<div key=${a.id} class="fitem" onClick=${()=>go("#/brief/"+a.id)}>
            <div class="ficon"><${Icon} n="user"/></div>
            <div class="fmain"><div class="ftitle">${a.name}</div><div class="fmeta"><${AxisBadge} axis="cold"/><span>${a.why_icp||"Profil ICP"}</span></div></div>
            <${ScoreBar} fit=${a.fit}/><${Tier} t=${a.fit.tier}/>
            <button class="btn ghost sm" onClick=${e=>{e.stopPropagation();go("#/brief/"+a.id);}}>Dossier</button>
          </div>`)}
        </div>
      </div>
    </div>`}
  </div>`;
}
function RivalBoard({rival,accounts,go,delay}){
  const clients=accounts.filter(a=>a.axis==="client");const prospects=accounts.filter(a=>a.axis==="prospect");
  const Mini=({a})=>html`<div class="miniacct" onClick=${()=>go("#/brief/"+a.id)}>
      <${Tier} t=${a.fit.tier}/><span class="mn">${a.name}</span><span class="mw"><${WindowPill} w=${a.window.state}/></span></div>`;
  return html`<div class="card rboard reveal" style=${{animationDelay:delay+"ms"}}>
    <div class="rhead"><div class="rlogo">${rival.name[0]}</div>
      <div style=${{flex:1,minWidth:0}}><div class="rname">${rival.name}</div><div class="rnote">${rival.note} · ${rival.client_count} clients connus</div></div></div>
    ${rival.faille.name&&html`<div class="faille"><div class="lbl"><${Icon} n="bolt" s=12/>Faille exploitable</div>
      <div class="nm">${rival.faille.name}</div><div class="lv">${rival.faille.levier}</div></div>`}
    <div class="rsplit">
      <div class="rcol capt"><div class="ch"><span>◆ Captation</span><span>${clients.length}</span></div>
        ${clients.length?clients.slice(0,5).map(a=>html`<${Mini} key=${a.id} a=${a}/>`):html`<div class="muted" style=${{fontSize:"12px"}}>—</div>`}</div>
      <div class="rcol inter"><div class="ch"><span>◆ Interception</span><span>${prospects.length}</span></div>
        ${prospects.length?prospects.slice(0,5).map(a=>html`<${Mini} key=${a.id} a=${a}/>`):html`<div class="muted" style=${{fontSize:"12px"}}>—</div>`}</div>
    </div>
  </div>`;
}

/* ======================================================= COMPTES (table) ======================================================= */
function Comptes({seed,axis,go}){
  const[q,setQ]=useState("");const[sort,setSort]=useState({k:"fit",dir:-1});
  let rows=seed.accounts.filter(a=>axis==="all"||a.axis===axis);
  if(q){const s=q.toLowerCase();rows=rows.filter(a=>a.name.toLowerCase().includes(s)||(a.rival||"").toLowerCase().includes(s));}
  const val=(a)=>({name:a.name,axis:a.axis,rival:a.rival||"",fit:a.fit.expected,tier:a.fit.tier,window:{OPEN:3,WARM:2,CLOSED:1}[a.window.state],signals:a.window.flags.length})[sort.k];
  rows=[...rows].sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*sort.dir;});
  const th=(k,l)=>html`<th onClick=${()=>setSort(s=>({k,dir:s.k===k?-s.dir:-1}))}>${l}${sort.k===k?html`<span class="ar">${sort.dir<0?"↓":"↑"}</span>`:""}</th>`;
  return html`<div class="wrap">
    <div class="pagehead"><div>
      <div class="eyebrow">Poste de travail</div>
      <h1>Comptes</h1>
      <div class="sub">Clients à capter et prospects à intercepter, scorés en fit × fenêtre. Clic sur une ligne → le dossier.</div>
    </div></div>
    <div class="card tablecard reveal">
      <div class="ttoolbar">
        <div class="search"><${Icon} n="target" s=14/><input placeholder="Filtrer par compte ou concurrent…" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
        <span class="meta">${rows.length} comptes</span>
        <div style=${{flex:1}}></div>
        <span class="meta">FIT = qualité · FENÊTRE = timing</span>
      </div>
      <div class="tscroll"><table>
        <thead><tr>${th("name","Compte")}${th("axis","Axe")}${th("rival","Concurrent")}${th("fit","Fit")}${th("tier","Tier")}${th("window","Fenêtre")}${th("signals","Signaux")}<th></th></tr></thead>
        <tbody>
          ${rows.map((a,i)=>html`<tr key=${a.id} onClick=${()=>go("#/brief/"+a.id)}>
            <td><div class="cname">${a.name}</div><div class="cdom">${a.domain}</div></td>
            <td><${AxisBadge} axis=${a.axis}/></td>
            <td>${a.rival?html`<span class="prov" style=${{color:"var(--dim)"}}>${a.rival}</span> ${a.certainty&&html`<${CertDot} c=${a.certainty}/>`}`:html`<span class="muted">—</span>`}</td>
            <td><${ScoreBar} fit=${a.fit}/></td>
            <td><${Tier} t=${a.fit.tier}/></td>
            <td><${WindowPill} w=${a.window.state}/></td>
            <td><span class="flagcount"><${Icon} n="flag" s=13/>${a.window.flags.length}</span></td>
            <td><button class="btn ghost sm" onClick=${e=>{e.stopPropagation();go("#/brief/"+a.id);}}>Dossier</button></td>
          </tr>`)}
        </tbody>
      </table></div>
    </div>
  </div>`;
}

/* ======================================================= BRIEF (screen 4) ======================================================= */
function Brief({seed,id,go}){
  const a=seed.accounts.find(x=>x.id===id);
  const[brief,setBrief]=useState(seed.briefs[id]||null);
  const[gen,setGen]=useState(false);const[genErr,setGenErr]=useState(null);
  useEffect(()=>{setBrief(seed.briefs[id]||null);setGenErr(null);},[id]);
  const generate=useCallback(async()=>{setGen(true);setGenErr(null);
    try{const d=await api("/api/brief",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account_id:id})});
      if(d.brief)setBrief(d.brief);else setGenErr(d.error||"Génération impossible.");}
    catch(e){setGenErr(e.message);}setGen(false);},[id]);
  if(!a)return html`<div class="wrap"><div class="empty"><div class="big">Compte introuvable</div><button class="btn ghost" onClick=${()=>go("#/radar")}>← Radar</button></div></div>`;
  const ax=AXES[a.axis];
  return html`<div class="wrap">
    <div class="pagehead reveal"><div>
      <div class="eyebrow" style=${{color:a.axis==="client"?"var(--capt)":"var(--inter)"}}>Dossier · ${ax.label}</div>
      <h1>${a.name} <span class="dim" style=${{fontWeight:500,fontSize:"16px"}}>${a.rival?"· "+ax.verb+" "+a.rival:""}</span></h1>
      <div class="sub">${a.domain} · CA ${a.firmo.ca_eur} · ${a.firmo.effectif} employés · ${a.firmo.pays}</div>
    </div>
    <div style=${{display:"flex",gap:"9px",alignItems:"center"}}>
      <button class="btn ghost sm" onClick=${()=>{if(history.length>1)history.back();else go("#/radar");}}>← Retour</button>
      <${WindowPill} w=${a.window.state}/><${Tier} t=${a.fit.tier}/>
    </div></div>

    <div class="brief">
      <div class="briefmain">
        <div class="card bhero reveal">
          <div class="bherotop">
            <div class="crest">
              <span class="cfb">${(a.name||"?")[0]}</span>
              <img src=${"https://logo.clearbit.com/"+a.domain} alt="" style=${{position:"absolute",inset:0}} onError=${e=>{e.target.style.display="none";}}/>
              <${Sparkle} s=13 cls="a"/><${Sparkle} s=9 cls="b s2"/>
            </div>
            <div style=${{flex:1,minWidth:0}}>
              <div class="metaline"><${AxisBadge} axis=${a.axis}/><${ScoreBar} fit=${a.fit}/><span class="dim" style=${{fontSize:"12px"}}>bande ${a.fit.band} · ${a.fit.pessimistic}–${a.fit.optimistic}</span></div>
              <div class="headline">${brief?brief.headline:"Dossier en cours de génération — lancez l'analyse pour ce compte."}</div>
              ${a.evidence&&html`<div class="quote">« ${a.evidence} »<span class="src">Preuve du minage · certitude ${a.certainty}</span></div>`}
            </div>
          </div>
        </div>

        ${brief?html`
        <div class="bgrid">
          <div class="card block reveal"><h3><span class="n">◆</span>Signaux clés</h3><div class="kv">
            ${brief.key_signals.map((s,i)=>html`<div class="krow" key=${i}><span class="kbullet"></span><div><div class="kl">${s.label}</div><div class="kd">${s.reading}</div></div></div>`)}</div></div>
          <div class="card block reveal"><h3><span class="n">◆</span>Axes stratégiques</h3><div class="kv">
            ${brief.strategic_axes.map((s,i)=>html`<div class="krow" key=${i}><span class="kbullet"></span><div><div class="kl">${s.axis}</div><div class="kd">${s.why}</div></div></div>`)}</div></div>
        </div>

        <div class="card block reveal"><h3><${Icon} n="user" s=13/>Membres clés à contacter <span class="dim" style=${{marginLeft:"auto",fontWeight:400,textTransform:"none",letterSpacing:0}}>enrichis via FullEnrich</span></h3>
          ${brief.key_members.map((m,i)=>html`<div class="member" key=${i}><div class="li" style=${{background:"var(--inter-soft)",color:"var(--inter)",width:"26px",height:"26px",borderRadius:"7px",display:"flex",alignItems:"center",justifyContent:"center",flex:"none"}}><${Icon} n="user" s=13/></div>
            <div><div class="mrole">${m.role}</div><div class="mwhy">${m.why}</div><div class="menrich"><${Icon} n="target" s=11/>${m.enrich}</div></div></div>`)}</div>

        <div class="card block reveal"><div class="msgbar"><h3 style=${{margin:0}}><${Icon} n="send" s=13/>Message pré-rédigé</h3>
          <${CopyBtn} text=${brief.pre_written_message}/></div>
          <div class="msg">${brief.pre_written_message}</div></div>

        <div class="bgrid">
          <div class="card block reveal"><h3><${Icon} n="budget" s=13/>Chiffres clés</h3><div class="kv">
            ${brief.key_figures.map((f,i)=>html`<div class="krow" key=${i}><span class="kbullet" style=${{background:"var(--gold)"}}></span><div><div class="kl">${f.figure}</div><div class="kd">${f.note}</div></div></div>`)}</div></div>
          <div class="card block reveal"><h3><${Icon} n="bolt" s=13/>Leviers de persuasion</h3>
            ${brief.levers.map((l,i)=>html`<div class="lever" key=${i}><div class="li"><${Icon} n="bolt" s=13/></div><div><div class="ll">${l.lever}</div><div class="lp">${l.proof}</div></div></div>`)}</div>
        </div>`:html`
        <div class="card block reveal" style=${{textAlign:"center",padding:"40px"}}>
          <div class="dim" style=${{marginBottom:"16px",maxWidth:"46ch",margin:"0 auto 16px"}}>Le dossier complet (signaux, axes, membres, message, leviers) se génère à la demande via Claude, ancré sur les faits réels de ce compte.</div>
          <button class="btn pri" onClick=${generate} disabled=${gen}>${gen?html`<span class="spin"></span>Génération…`:html`<${Icon} n="spark" s=15/>Générer le dossier`}</button>
          ${genErr&&html`<div style=${{marginTop:"14px",color:"var(--warn)",fontSize:"12.5px"}}>${genErr}</div>`}</div>`}
      </div>

      <${ChatRail} account=${a}/>
    </div>
  </div>`;
}
function CopyBtn({text}){const[ok,setOk]=useState(false);return html`<button class="btn ghost sm" onClick=${()=>{navigator.clipboard.writeText(text);setOk(true);setTimeout(()=>setOk(false),1500);}}><${Icon} n=${ok?"check":"copy"} s=13/>${ok?"Copié":"Copier"}</button>`;}

function ChatRail({account}){
  const[log,setLog]=useState([]);const[q,setQ]=useState("");const[busy,setBusy]=useState(false);const logRef=useRef();
  useEffect(()=>{setLog([]);},[account.id]);
  useEffect(()=>{if(logRef.current)logRef.current.scrollTop=logRef.current.scrollHeight;},[log,busy]);
  const send=async(text)=>{const t=(text||q).trim();if(!t||busy)return;setQ("");setLog(l=>[...l,{r:"u",t}]);setBusy(true);
    try{const d=await api("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account_id:account.id,question:t})});
      const abstain=/pas dans le dossier|absent|n'ai pas/i.test(d.answer||"");
      setLog(l=>[...l,{r:"a",t:d.answer||"…",abstain:!d.grounded||abstain}]);}
    catch(e){setLog(l=>[...l,{r:"a",t:"Erreur : "+e.message,abstain:true}]);}
    setBusy(false);};
  const sugg=["Pourquoi ce compte maintenant ?","Quel est le meilleur angle d'entrée ?","Quels sont les risques ?","Qui contacter en premier ?"];
  return html`<div class="card chatrail reveal">
    <div class="chathead"><div class="t"><${Icon} n="chat" s=15/>Assistant du compte</div>
      <div class="s">Répond uniquement sur les faits du dossier — sinon il s'abstient.</div></div>
    <div class="chatlog" ref=${logRef}>
      ${!log.length&&html`<div class="chatempty">Posez une question sur ${account.name}.<div class="suggests">${sugg.map(s=>html`<span key=${s} class="sugg" onClick=${()=>send(s)}>${s}</span>`)}</div></div>`}
      ${log.map((m,i)=>html`<div key=${i} class=${"bubble "+m.r+(m.abstain?" abstain":"")}>${m.t}</div>`)}
      ${busy&&html`<div class="bubble a"><span class="typing"><span></span><span></span><span></span></span></div>`}
    </div>
    <div class="chatin"><input placeholder="Votre question…" value=${q} onInput=${e=>setQ(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&send()}/>
      <button class="btn pri sm" onClick=${()=>send()} disabled=${busy}><${Icon} n="send" s=14/></button></div>
  </div>`;
}

/* ======================================================= ONBOARDING ======================================================= */
function Onboarding({seed,settings,setSettings,go}){
  const[step,setStep]=useState(0);
  const[profile,setProfile]=useState({desc:seed.company.description,sector:seed.company.sector,market:seed.company.market,
    services:[...seed.company.services],positioning:seed.company.positioning,tone:seed.company.tone,icp:seed.company.icp});
  const[rivals,setRivals]=useState(seed.rivals.map(r=>({name:r.name,domain:r.domain,why:r.note,on:true})));
  const[detecting,setDetecting]=useState(false);const[detectErr,setDetectErr]=useState(null);const[newSvc,setNewSvc]=useState("");
  const steps=["Profil","Clés API","Concurrents"];
  const keysOk=settings&&settings.keys.filter(k=>k.required).every(k=>k.present);
  const anthOk=settings&&settings.keys.find(k=>k.name==="ANTHROPIC_API_KEY")&&settings.keys.find(k=>k.name==="ANTHROPIC_API_KEY").present;

  const detect=async()=>{if(!anthOk){setDetectErr("Ajoutez d'abord votre clé Claude (étape 2) pour la détection par l'IA.");return;}
    setDetecting(true);setDetectErr(null);try{const d=await api("/api/detect-rivals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({description:profile.desc,sector:profile.sector})});
    if(d.rivals&&d.rivals.length)setRivals(d.rivals.map(r=>({...r,on:true})));else setDetectErr(d.error||"Aucun concurrent détecté — précisez la description.");}catch(e){setDetectErr(e.message);}setDetecting(false);};

  return html`<div class="wizwrap">
    <div class="stepper">
      ${steps.map((s,i)=>html`${i>0?html`<div key=${"l"+i} class=${"sline"+(i<=step?" done":"")}><div class="fill"></div></div>`:""}
        <div key=${s} class=${"snode"+(i<step?" done":i===step?" active":"")}><div class="dot">${i<step?html`<${Icon} n="check" s=15/>`:i+1}</div><div class="lbl">${s}</div></div>`)}
    </div>

    <div class="card pad reveal" key=${step}>
      ${step===0&&html`<div>
        <div class="steptitle">Votre entreprise</div><div class="stepsub">Plus c'est précis, meilleurs seront les concurrents détectés.</div>
        <div class="field"><label>Décrivez votre entreprise</label>
          <textarea class="ta" value=${profile.desc} onInput=${e=>setProfile(p=>({...p,desc:e.target.value}))}></textarea>
          <div class="hint">Ce que vous vendez, à qui, ce qui vous distingue.</div></div>
        <div class="row2">
          <div class="field"><label>Secteur / catégorie</label><input class="inp" value=${profile.sector} onInput=${e=>setProfile(p=>({...p,sector:e.target.value}))}/></div>
          <div class="field"><label>Marché géographique</label><input class="inp" value=${profile.market} onInput=${e=>setProfile(p=>({...p,market:e.target.value}))}/></div></div>
        <div class="field"><label>Services / offres</label><div class="chips">
          ${profile.services.map((s,i)=>html`<span key=${i} class="chip-e">${s}<button onClick=${()=>setProfile(p=>({...p,services:p.services.filter((_,j)=>j!==i)}))}>×</button></span>`)}
          <input class="inp" style=${{width:"150px",height:"34px",padding:"6px 12px"}} placeholder="+ ajouter…" value=${newSvc} onInput=${e=>setNewSvc(e.target.value)} onKeyDown=${e=>{if(e.key==="Enter"&&newSvc.trim()){setProfile(p=>({...p,services:[...p.services,newSvc.trim()]}));setNewSvc("");}}}/></div>
          <div class="hint">Tapez un service et Entrée pour l'ajouter.</div></div>
        <div class="row2">
          <div class="field"><label>Positionnement</label><input class="inp" value=${profile.positioning} onInput=${e=>setProfile(p=>({...p,positioning:e.target.value}))}/></div>
          <div class="field"><label>Ton de la marque</label><input class="inp" value=${profile.tone} onInput=${e=>setProfile(p=>({...p,tone:e.target.value}))}/></div></div>
        <div class="field"><label>Client idéal (ICP)</label><textarea class="ta" style=${{minHeight:"64px"}} value=${profile.icp} onInput=${e=>setProfile(p=>({...p,icp:e.target.value}))}></textarea></div>
      </div>`}

      ${step===1&&html`<div>
        <div class="steptitle">Vos clés API</div><div class="stepsub">DIGGR tourne sur VOS clés — vos données restent chez vous. Elles sont stockées localement, jamais renvoyées en clair.</div>
        ${(settings?settings.keys:[]).map(k=>html`<${KeyRow} key=${k.name} k=${k} setSettings=${setSettings}/>`)}
      </div>`}

      ${step===2&&html`<div>
        <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px",flexWrap:"wrap"}}>
          <div><div class="steptitle">Vos concurrents</div><div class="stepsub">L'IA les a détectés depuis votre description. Gardez les vrais, retirez les faux.</div></div>
          <button class="btn ghost sm" onClick=${detect} disabled=${detecting}>${detecting?html`<span class="spin"></span>Analyse…`:html`<${Icon} n="spark" s=14/>Re-détecter`}</button></div>
        ${detectErr&&html`<div style=${{marginTop:"12px",color:"var(--warn)",fontSize:"12.5px"}}>${detectErr}</div>`}
        <div style=${{marginTop:"18px"}}>
          ${rivals.map((r,i)=>html`<div key=${i} class=${"rivalcard"+(r.on?"":" off")}>
            <div class="rlogo" style=${{width:"30px",height:"30px",fontSize:"13px"}}>${(r.name||"?")[0]}</div>
            <div style=${{flex:1,minWidth:0}}><div class="rname">${r.name}</div><div class="rwhy">${r.why||r.domain}</div></div>
            <div class=${"toggle"+(r.on?" on":"")} onClick=${()=>setRivals(rs=>rs.map((x,j)=>j===i?{...x,on:!x.on}:x))}></div></div>`)}
        </div>
      </div>`}

      <div class="wizbar">
        <button class="btn ghost" onClick=${()=>step>0?setStep(step-1):go("#/radar")}>${step>0?"← Précédent":"Passer"}</button>
        ${step<2?html`<button class="btn pri" onClick=${()=>{if(step===0&&profile.desc.length>40)detect();setStep(step+1);}} disabled=${step===1&&!keysOk}>Continuer →</button>`
          :html`<button class="btn pri" onClick=${()=>go("#/radar")}><${Icon} n="bolt" s=15/>Lancer le minage</button>`}
      </div>
    </div>
  </div>`;
}
function KeyRow({k,setSettings}){
  const[v,setV]=useState("");const[busy,setBusy]=useState(false);
  const save=async()=>{if(!v.trim())return;setBusy(true);try{const s=await api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:k.name,value:v})});setSettings(s);setV("");}catch(e){}setBusy(false);};
  return html`<div class="keyrow">
    <div class=${"kdot "+(k.present?"ok":"no")}></div>
    <div class="kinfo"><div class="kl">${k.label}${k.required&&html`<span class="req">requis</span>`}${k.present&&html`<span class="muted" style=${{fontFamily:"var(--mono)",fontSize:"11px"}}>${k.masked}</span>`}</div>
      <div class="kr">${k.role}</div><div class="khow">↳ ${k.how}</div></div>
    <div style=${{display:"flex",gap:"7px"}}><input type="password" placeholder=${k.present?"Remplacer…":"Coller la clé…"} value=${v} onInput=${e=>setV(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&save()}/>
      <button class="btn ghost sm" onClick=${save} disabled=${busy||!v.trim()}>${busy?html`<span class="spin"></span>`:"OK"}</button></div>
  </div>`;
}

function Settings({settings,setSettings,onClose}){
  return html`<div class="scrim" onClick=${onClose}><div class="modal" onClick=${e=>e.stopPropagation()}>
    <div class="mh"><h2>Clés API</h2><button class="ico-btn" onClick=${onClose}>✕</button></div>
    <div class="mb">${(settings?settings.keys:[]).map(k=>html`<${KeyRow} key=${k.name} k=${k} setSettings=${setSettings}/>`)}</div>
  </div></div>`;
}

createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
